<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>ZapEngine — Effects Showcase</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a1a; overflow: hidden; }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #ccc;
        font: 14px monospace;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Move mouse: viewpoint / fog reveal<br>
      Click: spawn explosion (fire + smoke)<br>
      Left: alpha smoke emitter | Right: additive spark emitter<br>
      Orbs: additive-blend sprites | UI: visible through fog
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
